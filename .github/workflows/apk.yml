# Compila el APK automáticamente en GitHub cada vez que se sube un cambio.
# El archivo queda en la pestaña "Actions" > última ejecución > "Artifacts" > juegos-ancestrales-apk.
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # El servidor de GitHub ya trae el SDK de Android instalado.
      - name: Revisar SDK de Android
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Instalar dependencias
        run: npm install

      - name: Compilar la app web
        run: npm run build

      - name: Crear el proyecto Android
        run: |
          npx cap add android
          node scripts/android-permisos.mjs
          npx @capacitor/assets@3 generate --android --iconBackgroundColor '#f4b23e' --splashBackgroundColor '#7fb9ec' || echo "Íconos por defecto"
          npx cap sync android
          pip install --quiet pillow
          python3 scripts/optimizar-android.py

      # Firma siempre con la misma llave, para que cada versión se instale encima de la anterior
      # sin borrar la app. También sube el número de versión en cada compilación.
      - name: Firma fija y número de versión
        run: |
          mkdir -p ~/.android
          cp firma/debug.keystore ~/.android/debug.keystore
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"0.1.${{ github.run_number }}\"/" android/app/build.gradle
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  fija {
                      storeFile rootProject.file('../firma/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes { debug { signingConfig signingConfigs.fija } }
          }
          GRADLE
          grep -E "versionCode|versionName|fija" android/app/build.gradle

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: juegos-ancestrales-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Renombrar el instalador
        run: cp android/app/build/outputs/apk/debug/app-debug.apk JuegosAncestrales.apk

      # Publica el instalador en la sección "Releases" del repositorio para descargarlo desde el teléfono.
      - name: Publicar instalador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          gh release create "$TAG" JuegosAncestrales.apk --title "Juegos Ancestrales $TAG" --notes "Instalador para Android. Descarga JuegosAncestrales.apk en el teléfono y ábrelo." --latest
