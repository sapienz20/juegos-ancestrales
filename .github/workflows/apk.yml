# Compila el APK automáticamente en GitHub cada vez que se sube un cambio.
# El archivo queda en la pestaña "Actions" > última ejecución > "Artifacts" > juegos-ancestrales-apk.
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # El servidor de GitHub ya trae el SDK de Android instalado.
      - name: Revisar SDK de Android
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Instalar dependencias
        run: npm install

      - name: Compilar la app web
        run: npm run build

      - name: Crear el proyecto Android
        run: |
          npx cap add android
          node scripts/android-permisos.mjs
          npx @capacitor/assets@3 generate --android --iconBackgroundColor '#f4b23e' --splashBackgroundColor '#7fb9ec' || echo "Íconos por defecto"
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: juegos-ancestrales-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
